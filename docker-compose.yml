services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    environment:
      - PROSPECTOR_DB_PATH=/data/prospector.db
      - PROSPECTOR_API_KEYS=${PROSPECTOR_API_KEYS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
