[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "asteroid-mining-prospector"
version = "0.1.0"
description = "Bayesian data pipeline + Monte Carlo scoring system to rank NEO mining candidates"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "astroquery>=0.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "hypothesis-crosshair>=0.0.27",
    "mypy>=1.0",
    "mutmut>=2.4",
    "deal>=4.24",
    "z3-solver>=4.12",
    "atheris>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["crosshair: CrossHair SMT-backed tests (run nightly, not on every commit)"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "astroquery.*",
    "scipy.*",
    "z3.*",
]
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "prospector/"
runner = "python -m pytest -x --tb=no -q"
tests_dir = "tests/"

[tool.setuptools.packages.find]
include = ["prospector*"]
